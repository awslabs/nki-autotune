[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
skip-magic-trailing-comma = true

[tool.isort]
known_first_party = ["kernel_library", "nkigym", "self_evolve"]
profile = "black"
line_length = 120

[tool.pyright]
extraPaths = [".agents/skills/self-evolve/scripts", "nkigym/src"]
reportMissingImports = "none"

[tool.pytest.ini_options]
pythonpath = ["nkigym/src"]
testpaths = ["test"]
