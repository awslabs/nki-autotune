[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
skip-magic-trailing-comma = true

[tool.isort]
known_first_party = ["kernel_library", "nkigym"]
profile = "black"
line_length = 120

[tool.pyright]
extraPaths = ["nkigym/src"]
reportMissingImports = "none"

[tool.pytest.ini_options]
pythonpath = ["nkigym/src"]
required_plugins = ["pytest-timeout"]
testpaths = ["test"]
