[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nkigym"
version = "0.1.0"
description = "NKI Gym - Kernel development environment"
requires-python = ">=3.10"
dependencies = [
    "ml-dtypes",
    "networkx",
    "neuronx-cc~=2.26.0",
    "nki~=0.5.0",
    "numpy",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "pre-commit",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
